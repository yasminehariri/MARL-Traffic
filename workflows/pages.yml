# Publishes the results website on GitHub Pages: https://yasminehariri.github.io/MARL-Traffic/
# It copies site/ and demo/ side by side (the same layout as the repo, so links like
# ../demo/index.html work both locally and online) and adds a root page that opens site/.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
    paths: ["site/**", "demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site demo _site/
          rm -f _site/demo/README.md _site/site/data/README.md
          printf '<!doctype html><meta charset="utf-8"><title>MARL Traffic</title><meta http-equiv="refresh" content="0; url=site/"><a href="site/">Open the website</a>\n' > _site/index.html
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
