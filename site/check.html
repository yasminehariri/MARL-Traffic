<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Check</title>
<style>
  :root { color-scheme: light dark; --ok: #1a7f37; --bad: #cf222e; --line: #8884; }
  body { font: 15px/1.5 system-ui, sans-serif; margin: 0 auto; padding: 24px 16px; max-width: 980px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 8px; }
  p { margin: 4px 0 12px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid var(--line); padding: 4px 10px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  td.ok { color: var(--ok); } td.bad { color: var(--bad); font-weight: 700; }
  #verdict { font-size: 18px; font-weight: 700; padding: 10px 14px; border-radius: 8px; border: 2px solid; display: inline-block; }
  #verdict.ok { color: var(--ok); } #verdict.bad { color: var(--bad); }
  code { font-size: 13px; }
</style>
</head>
<body>
<h1>Website data check</h1>
<p>This page reads <code>site/data/*.json</code> through <code>js/data.js</code>, exactly as the website does, and compares the main numbers with the final results report (<code>results/mg5/final/README.md</code>). If anything is red, do not publish. Rerun <code>python scripts/export_site_data.py</code> and tell Yasmine.</p>
<div id="verdict">checking…</div>
<p id="meta"></p>
<div id="out"></div>

<script type="module">
import { loadData, one, fmt } from './js/data.js';

// Values published in results/mg5/final/README.md (1 decimal). Used ONLY to test the data files.
const EXPECT = {
  'Normal traffic (true delay, s/vehicle)': {
    experiment: 'normal', variant: 'standard', cols: ['uniform', 'peak', 'asym'],
    rows: [
      ['E1', 'greedy', [33.9, 92.1, 34.8]], ['E1', 'sampled', [36.1, 95.3, 37.5]],
      ['B1', 'greedy', [29.5, 685.2, 26.6]], ['B1', 'sampled', [32.0, 172.8, 34.6]],
      ['B2', 'greedy', [47.0, 854.9, 207.8]], ['B2', 'sampled', [45.3, 426.0, 78.1]],
      ['tuned', 'none', [93.2, 169.5, 126.2]], ['fixed', 'none', [140.5, 172.3, 159.8]], ['random', 'none', [122.1, 323.7, 251.1]],
    ] },
  'Surge (true delay, s/vehicle)': {
    experiment: 'surge', variant: 'standard', cols: ['surge'],
    rows: [
      ['fixed', 'none', [334.6]], ['E1', 'greedy', [481.9]], ['E1', 'sampled', [508.8]], ['B1', 'greedy', [871.2]], ['B1', 'sampled', [481.6]],
      ['B2', 'greedy', [944.7]], ['B2', 'sampled', [641.5]], ['tuned', 'none', [525.0]], ['random', 'none', [533.3]],
    ] },
  'Sensor failure at junction B1 (true delay, s/vehicle)': {
    experiment: 'sensor_failure', variant: 'failure', cols: ['uniform', 'peak', 'asym'],
    rows: [
      ['E1', 'greedy', [348.5, 630.9, 241.3]], ['B1', 'greedy', [577.5, 994.6, 366.3]], ['B2', 'greedy', [476.6, 966.9, 388.2]],
      ['E1', 'sampled', [95.3, 284.9, 94.4]], ['B1', 'sampled', [257.5, 552.7, 134.4]], ['B2', 'sampled', [209.0, 512.2, 190.2]],
    ] },
  'Sensor failure with fixed-time fallback (true delay, s/vehicle)': {
    experiment: 'sensor_failure', variant: 'failure_failsafe', cols: ['uniform', 'peak', 'asym'],
    rows: [['E1', 'greedy', [35.3, 93.6, 36.6]], ['B1', 'greedy', [31.2, 648.7, 29.0]], ['B2', 'greedy', [52.2, 840.1, 223.6]]] },
};

const out = document.getElementById('out');
let bad = 0, total = 0;
try {
  const D = await loadData();
  document.getElementById('meta').textContent = `Data generated ${D.meta.generated} from commit ${D.meta.git_commit || '?'}; ${D.episodes.length} episodes from ${D.meta.sources.length} files.`
    + (D.meta.missing_files.length ? ` Not yet available: ${D.meta.missing_files.map(m => m.file).join(', ')}.` : '');
  for (const [title, spec] of Object.entries(EXPECT)) {
    let html = `<h2>${title}</h2><div class="wrap"><table><tr><th>Controller</th><th>Mode</th>${spec.cols.map(c => `<th>${c}</th>`).join('')}</tr>`;
    for (const [controller, mode, want] of spec.rows) {
      html += `<tr><td>${controller}</td><td>${mode}</td>`;
      spec.cols.forEach((scenario, i) => {
        total++;
        let got = null;
        try { got = one(D.summary, { experiment: spec.experiment, variant: spec.variant, controller, mode, scenario }).true_delay_mean; } catch (e) { /* missing row */ }
        const ok = got != null && fmt.delay(got) === want[i].toFixed(1);
        if (!ok) bad++;
        html += `<td class="${ok ? 'ok' : 'bad'}" title="report: ${want[i].toFixed(1)}">${fmt.delay(got)}${ok ? '' : ` (report ${want[i].toFixed(1)})`}</td>`;
      });
      html += '</tr>';
    }
    out.insertAdjacentHTML('beforeend', html + '</table></div>');
  }
  // the E1-vs-B1 peak comparison quoted in the report: 87% lower, 10 of 10 seeds, p = 0.002
  const c = one(D.comparisons, { experiment: 'normal', variant: 'standard', mode: 'greedy', scenario: 'peak', other: 'B1' });
  const okc = Math.round(-c.diff_pct) === 87 && c.e1_better_seeds === 10 && fmt.p(c.wilcoxon_p) === 'p = 0.002';
  total++; if (!okc) bad++;
  out.insertAdjacentHTML('beforeend', `<h2>Comparison check</h2><p class="${okc ? 'ok' : 'bad'}">E1 vs B1, peak, greedy: ${fmt.pct(c.diff_pct)} lower, better on ${c.e1_better_seeds} of ${c.n} seeds, ${fmt.p(c.wilcoxon_p)} ${okc ? '✓' : '✗ (report: 87%, 10 of 10, p = 0.002)'}</p>`);
} catch (e) {
  bad++; out.insertAdjacentHTML('beforeend', `<p class="bad"><b>Error:</b> ${e.message}</p>`);
}
const v = document.getElementById('verdict');
v.className = bad ? 'bad' : 'ok';
v.textContent = bad ? `${bad} of ${total} checks FAILED` : `All ${total} checks passed`;
window.__checkResult = { bad, total };
</script>
</body>
</html>
